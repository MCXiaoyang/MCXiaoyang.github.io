<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>&#25105;&#30340;&#20010;&#20154;&#32593;&#31449;</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #2b2b2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        .window {
            width: 600px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            user-select: none;
            min-width: 400px;
        }
        .title-bar {
            background: #f0f0f0;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            flex-shrink: 0;
            border-bottom: 1px solid #d0d0d0;
        }
        .title-bar:active {
            cursor: grabbing;
        }
        .title-text {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .title-text .icon {
            font-size: 16px;
        }
        .window-controls {
            display: flex;
            gap: 6px;
        }
        .window-controls button {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #333;
            transition: background 0.2s;
        }
        .window-controls button:hover {
            background: #d0d0d0;
        }
        .window-controls .close-btn:hover {
            background: #e81123;
            color: #fff;
        }
        .window-content {
            flex: 1;
            padding: 40px;
            background: #fff;
            text-align: center;
        }
        .window-content h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
        }
        .window-content p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        .btn-open {
            display: inline-block;
            padding: 14px 50px;
            font-size: 18px;
            background: #0078d7;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            transition: background 0.2s;
        }
        .btn-open:hover {
            background: #005a9e;
        }
        .btn-open:active {
            background: #004578;
        }
    </style>
</head>
<body>

    <div class="window" id="window">
        <div class="title-bar" id="titleBar">
            <div class="title-text">
                <span class="icon">&#127760;</span>
                <span>&#25105;&#30340;&#32593;&#31449;</span>
            </div>
            <div class="window-controls">
                <button class="close-btn" title="&#20851;&#38381;">&#10005;</button>
            </div>
        </div>
        <div class="window-content">
            <h1>&#27426;&#36814;&#26469;&#21040;&#25105;&#30340;&#32593;&#31449;&#65281;</h1>
            <p>&#28857;&#20987;&#19979;&#26041;&#25353;&#38062;&#25171;&#24320; topserver.gt.tc</p>
            <a href="https://topserver.gt.tc" target="_blank" class="btn-open">
                &#25171;&#24320; topserver.gt.tc
            </a>
        </div>
    </div>

    <script>
        // ========== &#25302;&#21160;&#31383;&#21475; ==========
        const windowEl = document.getElementById('window');
        const titleBar = document.getElementById('titleBar');

        let isDragging = false;
        let offsetX = 0, offsetY = 0;

        titleBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = windowEl.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            windowEl.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const x = e.clientX - offsetX;
            const y = e.clientY - offsetY;
            windowEl.style.left = x + 'px';
            windowEl.style.top = y + 'px';
            windowEl.style.transform = 'none';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            windowEl.style.cursor = 'default';
        });

        // ========== &#20851;&#38381; ==========
        document.querySelector('.close-btn').addEventListener('click', () => {
            if (confirm('&#30830;&#23450;&#35201;&#20851;&#38381;&#31383;&#21475;&#21527;&#65311;')) {
                windowEl.style.display = 'none';
            }
        });
    </script>

</body>
</html>
