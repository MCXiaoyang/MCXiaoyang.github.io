<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>&#26434;&#35760;</title>
</head>
<body>

<h1>&#26434;&#35760;</h1>
<p><a href="https://github.com/MCXiaoyang/MCXiaoyang.github.io/issues/new" target="_blank">&#20889;&#19968;&#31687;</a></p>

<div id="list">&#21152;&#36733;&#20013;...</div>

<script>
const REPO = 'MCXiaoyang/MCXiaoyang.github.io';

async function load() {
    const el = document.getElementById('list');
    try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/issues?state=open&sort=created&direction=desc`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        const posts = data.filter(i => !i.pull_request);
        if (!posts.length) {
            el.innerHTML = '&#26242;&#26080;';
            return;
        }

        let html = '';
        posts.forEach(p => {
            const d = new Date(p.created_at);
            const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
            html += `
                <hr>
                <p><b>${p.title}</b><br>
                ${ds}<br>
                ${(p.body || '').replace(/\n/g, '<br>')}</p>
            `;
        });
        el.innerHTML = html;
    } catch (e) {
        el.innerHTML = '&#35835;&#21462;&#22833;&#36133;';
    }
}

load();
</script>

</body>
</html>
